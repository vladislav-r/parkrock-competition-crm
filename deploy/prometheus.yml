global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: parkrock-backend
    static_configs:
      - targets: ["backend:8001"]

  - job_name: parkrock-postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          kubernetes_namespace: parkrock
          release: parkrock-postgres

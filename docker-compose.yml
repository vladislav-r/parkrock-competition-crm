name: climbhub

services:
  postgres:
    image: postgres:16-alpine
    container_name: climbhub-postgres
    environment:
      POSTGRES_DB: climbhub
      POSTGRES_USER: climbhub
      POSTGRES_PASSWORD: climbhub
    ports:
      - "5432:5432"
    volumes:
      - climbhub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climbhub -d climbhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: climbhub-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://climbhub:climbhub@postgres:5432/climbhub?sslmode=disable
    command: ["--collector.postmaster"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.10

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: climbhub-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
      - --storage.tsdb.retention.size=64MB
      - --storage.tsdb.wal-compression
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - climbhub_prometheus:/prometheus
    mem_limit: 128m
    cpus: 0.20

  loki:
    image: grafana/loki:3.7.7
    container_name: climbhub-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./deploy/loki.yml:/etc/loki/local-config.yaml:ro
      - climbhub_loki:/loki
    mem_limit: 384m
    cpus: 0.25

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: climbhub-alloy
    restart: unless-stopped
    command: ["run", "--disable-reporting", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./runtime-logs:/var/log/parkrock:ro
      - climbhub_alloy:/var/lib/alloy/data
    depends_on:
      - loki
    mem_limit: 128m
    cpus: 0.10

  grafana:
    image: grafana/grafana:12.1.0
    container_name: climbhub-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    mem_limit: 384m
    cpus: 1.0

volumes:
  climbhub_postgres:
  climbhub_prometheus:
  climbhub_loki:
  climbhub_alloy:
